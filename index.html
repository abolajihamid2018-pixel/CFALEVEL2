<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q-Bank Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one reading column. Top bar, progress strip, filters, question card, then a collapsible question map and parser settings. */
:root {
  --bg: #EDF1F5; --surface: #FFFFFF; --surface-2: #F4F7FA; --fg: #13202B; --muted: #546576; --line: #D1DAE2;
  --accent: #0A5C8F; --accent-fg: #FFFFFF; --accent-soft: #DAEAF5;
  --good: #17703F; --good-soft: #DDF1E4; --bad: #B3261E; --bad-soft: #FBE3E0; --warn: #8A5A00; --warn-soft: #FBEFD0;
  --ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --read: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161D; --surface: #15202A; --surface-2: #1A2733; --fg: #E4ECF2; --muted: #93A4B3; --line: #263644;
    --accent: #5DB2E8; --accent-fg: #06202F; --accent-soft: #17303F;
    --good: #58CC8A; --good-soft: #12301F; --bad: #FF8A80; --bad-soft: #3A1916; --warn: #E6B656; --warn-soft: #342608;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161D; --surface: #15202A; --surface-2: #1A2733; --fg: #E4ECF2; --muted: #93A4B3; --line: #263644;
  --accent: #5DB2E8; --accent-fg: #06202F; --accent-soft: #17303F;
  --good: #58CC8A; --good-soft: #12301F; --bad: #FF8A80; --bad-soft: #3A1916; --warn: #E6B656; --warn-soft: #342608;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--ui); }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; margin-bottom: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 600 20px/1.2 var(--ui); letter-spacing: -0.01em; }
.brand span { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.bar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.bar-actions select { max-width: 220px; min-width: 0; }
select, input[type="text"] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 40px; }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; min-height: 40px; font-weight: 500; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.good { color: var(--good); border-color: var(--good); }
.btn.bad { color: var(--bad); border-color: var(--bad); }
.btn.good.on { background: var(--good-soft); }
.btn.bad.on { background: var(--bad-soft); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 10px; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }

.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0; min-width: 0; flex: 1 1 260px; }
.drop strong { font-weight: 600; }

.strip { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font: 500 11px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 500 20px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--muted); }
.stat .v.warn { color: var(--warn); }
.meter { display: flex; height: 6px; margin-top: 14px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter span { display: block; height: 100%; }
.meter .c { background: var(--good); }
.meter .w { background: var(--bad); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; min-height: 36px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: baseline; }
.chip b { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] b { color: inherit; opacity: 0.75; }
.controls .spacer { flex: 1 1 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px 20px 18px; margin-bottom: 14px; min-width: 0; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; }
.qno { font: 600 13px/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.tag { font: 500 11px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 4px; }
.qpos { font: 400 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.timer { margin-left: auto; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.timer.over { color: var(--warn); }
.flagged { color: var(--warn); font: 500 11px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; }

.stem { font: 400 18px/1.62 var(--read); white-space: pre-line; overflow-wrap: anywhere; margin: 0 0 16px; max-width: 68ch; }
.choices { display: flex; flex-direction: column; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
.choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 11px 14px; cursor: pointer; font: 400 16px/1.5 var(--read); }
.choice .letter { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; font: 500 12px var(--mono); color: var(--muted); margin-top: 1px; }
.choice .txt { min-width: 0; overflow-wrap: anywhere; }
.choice:hover:not(:disabled) { border-color: var(--muted); }
.choice:disabled { cursor: default; }
.choice.is-picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.is-picked .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.choice.is-correct { border-color: var(--good); background: var(--good-soft); }
.choice.is-correct .letter { background: var(--good); border-color: var(--good); color: var(--bg); }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.is-wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--bg); }

.answer { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 4px; display: flex; flex-direction: column; gap: 14px; }
.verdict { padding: 10px 14px; border-radius: 6px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); }
.verdict.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.atext { font: 400 16px/1.65 var(--read); white-space: pre-line; overflow-wrap: anywhere; max-width: 68ch; margin: 0; }
.grade { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grade .lbl { color: var(--muted); font-size: 14px; margin-right: 4px; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.pages { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pages canvas { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.actions .grow { flex: 1 1 0; }
.kbd { font: 400 12px var(--mono); color: var(--muted); }

details.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
details.panel > summary { cursor: pointer; padding: 12px 16px; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: '+'; font: 500 16px var(--mono); color: var(--muted); }
details.panel[open] > summary::after { content: '\2212'; }
.panel-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.cell { position: relative; min-height: 36px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); font: 500 12px var(--mono); cursor: pointer; font-variant-numeric: tabular-nums; }
.cell.seen { background: var(--accent-soft); border-color: var(--accent); }
.cell.c { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.cell.w { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.now { outline: 2px solid var(--fg); outline-offset: 1px; }
.cell.flag::after { content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-weight: 500; font-size: 14px; }
.field input { width: 100%; font-family: var(--mono); font-size: 13px; }
.field .hint { font-size: 12px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.summary-line { font: 400 13px/1.5 var(--mono); color: var(--muted); margin: 0; }

.progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 12px; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); }
.empty { text-align: left; }
.empty h2 { margin: 0 0 6px; font: 600 18px var(--ui); }
.empty p { margin: 0 0 12px; color: var(--muted); max-width: 60ch; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: min(92vw, 520px); z-index: 20; }

@media (max-width: 560px) {
  .card { padding: 16px 14px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stem { font-size: 17px; }
  .timer { margin-left: 0; }
  .kbd { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .meter span { transition: flex-basis 0.25s ease; }
  .progress span { transition: width 0.15s linear; }
}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
'use strict';

/*PARSER-START*/
var DEFAULT_ANS = '^\\s*(?:the\\s+)?(?:correct\\s+)?(?:answer|ans|solution|explanation|rationale)\\b\\s*[:\\-\\u2013.]?';
var QSTART_1 = /^\s*(?:question|q|item)\s*#?\s*(\d{1,4})\b(?:\s+of\s+\d+)?\s*[:.\-–)]?\s*/i;
var QSTART_2 = /^\s*(\d{1,4})\s*[.)]\s+(?=\S)/;

function normKey(t) { return t.replace(/\d+/g, '#').toLowerCase(); }

function isProtected(t) {
  return QSTART_1.test(t) || QSTART_2.test(t) || /^\(?[A-E][.)]\s/.test(t) || new RegExp(DEFAULT_ANS, 'i').test(t);
}

// Drops running headers and footers: short lines that sit at the top or bottom of at least 40% of the pages.
function stripRunning(pages) {
  var n = pages.length, counts = {}, out = [];
  pages.forEach(function (ls) {
    var seen = {};
    [0, 1, ls.length - 2, ls.length - 1].forEach(function (i) {
      if (i >= 0 && i < ls.length) {
        var k = normKey(ls[i]);
        if (!seen[k]) { seen[k] = 1; counts[k] = (counts[k] || 0) + 1; }
      }
    });
  });
  var thr = Math.max(3, Math.ceil(n * 0.4));
  pages.forEach(function (ls, pi) {
    ls.forEach(function (t, i) {
      var edge = i < 2 || i >= ls.length - 2;
      if (edge && n >= 3 && t.length < 120 && counts[normKey(t)] >= thr && !isProtected(t)) return;
      out.push({ t: t, p: pi + 1 });
    });
  });
  return out;
}

function collect(lines, re) {
  var out = [];
  lines.forEach(function (l, i) {
    var m = re.exec(l.t);
    if (m) out.push({ i: i, num: m[1] !== undefined ? parseInt(m[1], 10) : out.length + 1 });
  });
  return out;
}

// Longest run of candidates numbered 1, 2, 3... (a restart at 1 is allowed when restart is true).
function bestChain(c, restart) {
  var best = [];
  for (var s = 0; s < c.length && s < 80; s++) {
    var chain = [c[s]], last = c[s].num;
    for (var j = s + 1; j < c.length; j++) {
      var n = c[j].num;
      if (n === last + 1 || (restart && n === 1 && last > 1)) { chain.push(c[j]); last = n; }
    }
    if (chain.length > best.length) best = chain;
  }
  return best;
}

function para(ls) {
  if (!ls.length) return '';
  var max = 0;
  ls.forEach(function (l) { if (l.length > max) max = l.length; });
  var out = ls[0];
  for (var i = 1; i < ls.length; i++) {
    var prev = ls[i - 1];
    var brk = (/[.?!:;]$/.test(prev) && prev.length < max * 0.72) || /^(?:[-•●▪]\s|\d+[.)]\s|Table\b|Exhibit\b|Figure\b)/.test(ls[i]);
    out += (brk ? '\n' : ' ') + ls[i];
  }
  return out;
}

function splitChoices(ls) {
  var re = /^\(?([A-E])[.)]\s+(.*)$/, expect = 'A', found = [], first = -1;
  for (var i = 0; i < ls.length; i++) {
    var m = re.exec(ls[i]);
    if (m && m[1] === expect) {
      if (first < 0) first = i;
      found.push({ k: m[1], t: [m[2]] });
      expect = String.fromCharCode(expect.charCodeAt(0) + 1);
    } else if (found.length) {
      found[found.length - 1].t.push(ls[i]);
    }
  }
  if (found.length < 2) return { stem: ls, choices: [] };
  return { stem: ls.slice(0, first), choices: found.map(function (f) { return { k: f.k, t: f.t.join(' ') }; }) };
}

function findCorrect(txt, choices) {
  var keys = choices.map(function (c) { return c.k; });
  var pats = [
    /(?:[Cc]orrect\s+(?:[Aa]nswer|[Cc]hoice|[Oo]ption)|[Aa]nswer|ANSWER)\s*(?:is|was|=|:|-|–)?\s*\(?([A-E])\)?(?![A-Za-z])(?!\s+[a-z])/,
    /\b([A-E])\s+is\s+(?:the\s+)?correct/,
    /[Cc]orrect\s*[:\-–]\s*\(?([A-E])\)?(?![A-Za-z])/
  ];
  for (var i = 0; i < pats.length; i++) {
    var m = pats[i].exec(txt);
    if (m && keys.indexOf(m[1]) >= 0) return m[1];
  }
  return null;
}

function parseLines(lines, qStr, aStr) {
  var ansRe, chain = null, stripRe = null, label = 'auto';
  try { ansRe = new RegExp(aStr || DEFAULT_ANS, 'i'); } catch (e) { ansRe = new RegExp(DEFAULT_ANS, 'i'); }
  if (qStr) {
    var cre = null;
    try { cre = new RegExp(qStr, 'i'); } catch (e2) { cre = null; }
    if (cre) { chain = bestChain(collect(lines, cre), true); stripRe = cre; label = 'custom'; }
  }
  if (!chain) {
    var ch1 = bestChain(collect(lines, QSTART_1), true);
    var ch2 = bestChain(collect(lines, QSTART_2), false);
    if (ch1.length >= ch2.length) { chain = ch1; stripRe = QSTART_1; label = '"Question N"'; }
    else { chain = ch2; stripRe = QSTART_2; label = '"N."'; }
  }
  var qs = [];
  if (chain.length < 2) return { questions: qs, strategy: label };
  for (var k = 0; k < chain.length; k++) {
    var s = chain[k].i, e = k + 1 < chain.length ? chain[k + 1].i : lines.length;
    var blk = lines.slice(s, e).map(function (l) { return l.t; });
    blk[0] = blk[0].replace(stripRe, '').trim();
    if (!blk[0]) blk.shift();
    var cut = -1;
    for (var j = 1; j < blk.length; j++) { if (ansRe.test(blk[j])) { cut = j; break; } }
    var qLines = cut < 0 ? blk : blk.slice(0, cut);
    var aLines = cut < 0 ? [] : blk.slice(cut);
    var sc = splitChoices(qLines);
    var aTxt = para(aLines);
    qs.push({
      n: chain[k].num,
      stem: para(sc.stem),
      choices: sc.choices,
      correct: sc.choices.length ? findCorrect(aTxt, sc.choices) : null,
      answer: aTxt,
      p1: lines[s].p,
      p2: lines[e - 1].p
    });
  }
  return { questions: qs, strategy: label };
}
/*PARSER-END*/

// ---------- state ----------
var STORE_KEY = 'qbankdrill.v1';
var PACE = 180; // CFA Level II pace: 132 minutes for 44 questions is 3:00 each
var state = { banks: {}, order: [], active: null, prefs: { shuffle: false, filter: 'all', qre: '', are: '' } };
var view = { queue: [], pos: 0, revealed: false, pick: null, startedAt: 0, showPages: false, done: false, loading: null,
             pdf: null, pdfBank: null, raw: {}, navOpen: false, setOpen: false, confirm: null };
var saveWarned = false;

var SAMPLE = {
  id: 'sample', name: 'Sample bank', isSample: true, created: 0, progress: {}, flags: {},
  questions: [
    { n: 1, topic: 'Fixed Income', stem: 'Compared with an otherwise identical option-free bond, the effective duration of a callable bond is most likely:',
      choices: [{ k: 'A', t: 'higher.' }, { k: 'B', t: 'lower.' }, { k: 'C', t: 'the same.' }], correct: 'B',
      answer: 'Answer: B\n\nThe call option limits price appreciation when yields fall, so the callable bond’s price is less sensitive to yield changes. Its effective duration is lower than that of the option-free bond.', p1: null, p2: null },
    { n: 2, topic: 'Derivatives', stem: 'An asset pays no cash flows and has a spot price of 100. The continuously compounded risk-free rate is 5%. The no-arbitrage price of a one-year forward contract is closest to:',
      choices: [{ k: 'A', t: '100.00.' }, { k: 'B', t: '105.00.' }, { k: 'C', t: '105.13.' }], correct: 'C',
      answer: 'Answer: C\n\nF0 = S0 × e^(rT) = 100 × e^0.05 = 105.13. Using simple 5% interest (105.00) ignores continuous compounding.', p1: null, p2: null },
    { n: 3, topic: 'Quantitative Methods', stem: 'In a multiple regression, a Durbin-Watson statistic close to 2 most likely indicates:',
      choices: [{ k: 'A', t: 'positive serial correlation in the residuals.' }, { k: 'B', t: 'no serial correlation in the residuals.' }, { k: 'C', t: 'negative serial correlation in the residuals.' }], correct: 'B',
      answer: 'Answer: B\n\nDW is approximately 2(1 − r), where r is the correlation between residuals and their lagged values. A value near 2 means r is near zero, so there is no evidence of serial correlation.', p1: null, p2: null }
  ]
};

function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.banks && s.order) {
        state.banks = s.banks; state.order = s.order; state.active = s.active;
        state.prefs = Object.assign(state.prefs, s.prefs || {});
      }
    }
  } catch (e) { /* storage unavailable: start fresh */ }
  if (!state.order.length) { state.banks.sample = SAMPLE; state.order = ['sample']; state.active = 'sample'; }
  if (!state.banks[state.active]) state.active = state.order[0];
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) {
    if (!saveWarned) { saveWarned = true; toast('This browser could not save your progress. It will be lost when you close the page.'); }
  }
}

// ---------- helpers ----------
function $(s) { return document.querySelector(s); }
function add(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
  el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
}
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;

  }
  if (b.questions.length) app.appendChild(mapPanel(b));
  app.appendChild(settingsPanel(b));
}

// ---------- events ----------
$('#pdfInput').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0]; e.target.value = ''; handleFile(f);
});
document.addEventListener('dragover', function (e) { e.preventDefault(); });
document.addEventListener('drop', function (e) {
  e.preventDefault();
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});
document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  var b = bank();
  if (!b || view.loading || view.done || !view.queue.length) return;
  var q = b.questions[curIdx()], k = e.key;
  if (/^[a-eA-E]$/.test(k)) {
    var up = k.toUpperCase();
    if (!view.revealed && q.choices.some(function (c) { return c.k === up; })) { view.pick = up; render(); }
    return;
  }
  if (k === 'Enter' && !(t && t.tagName === 'BUTTON')) { e.preventDefault(); if (view.revealed) next(); else reveal(); }
  else if (k === 'ArrowRight') next();
  else if (k === 'ArrowLeft') prev();
  else if (k === 'f' || k === 'F') toggleFlag();
});
setInterval(function () {
  var t = document.getElementById('timer');
  if (!t || view.revealed || !view.startedAt) return;
  var s = Math.floor((Date.now() - view.startedAt) / 1000);
  t.textContent = fmt(s) + ' / 3:00'; t.classList.toggle('over', s > PACE);
}, 500);

load(); buildQueue(); render();
})();
</script>
</body>
</html>
